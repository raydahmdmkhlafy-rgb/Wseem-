<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>متجر وسام</title>
<style>
body{font-family:Tahoma;background:#f1f5f9;margin:0}
header{background:#0f172a;color:#fff;padding:22px;text-align:center}
header h1{margin:0;font-size:24px}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:15px;max-width:1000px;margin:auto}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.card img{width:100%;height:145px;object-fit:cover}
.card-body{padding:10px}
.price{color:#1d4ed8;font-weight:bold;margin-top:5px}
.btn{width:100%;padding:8px;background:#22c55e;color:#fff;border:0;border-radius:8px;margin-top:8px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<header><h1>💻 متجر وسام للإلكترونيات</h1><p>ذمار - أفضل الأسعار</p></header>
<div class="products" id="list"></div>
<script>
const items=[
{name:'HP Core i7 13th',price:520000,img:'https://images.unsplash.com/photo-1588872657578-7efd1f1555ed?w=500'},
{name:'Dell i5 12th',price:380000,img:'https://images.unsplash.com/photo-1593642632823-8f785ba67e45?w=500'},
{name:'Lenovo IdeaPad 3',price:295000,img:'https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=500'},
{name:'Asus VivoBook',price:245000,img:'https://images.unsplash.com/photo-1525547719571-a2d4ac8945e2?w=500'},
{name:'سامسونج 32 Smart',price:145000,img:'https://images.unsplash.com/photo-1593359677879-a4bb92f367d8?w=500'},
{name:'LG 43 4K',price:265000,img:'https://images.unsplash.com/photo-1567690187548-f07b1d7f5a9?w=500'}
];
let h='';items.forEach(o=>{h+=`<div class="card"><img src="${o.img}"><div class="card-body"><h3>${o.name}</h3><div class="price">${o.price.toLocaleString()} ريال</div><button class="btn" onclick="window.open('https://wa.me/967777000000?text=اريد '+encodeURIComponent(o.name))">اطلب واتساب</button></div></div>`});
document.getElementById('list').innerHTML=h;
</script>
</body>
</html>
